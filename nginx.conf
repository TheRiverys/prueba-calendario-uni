server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Headers de seguridad base (válidos en HTTP) ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # X-XSS-Protection está deprecado; mejor CSP. (si quieres CSP, añade aquí una acorde a tu app)

    # --- Buffers/limits razonables para cookies grandes y cuerpos grandes ---
    client_max_body_size        50M;
    client_header_buffer_size   16k;
    large_client_header_buffers 4 16k;

    # --- Timeouts ---
    client_body_timeout   30s;
    client_header_timeout 30s;
    send_timeout          30s;

    # ---------- Caché de estáticos ----------
    # 1) Archivos con hash en nombre -> cache inmutable 1 año
    location ~* "\.[0-9a-f]{8,}\.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2|ttf|eot)$" {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # 2) Estáticos sin hash -> cache corta
    location ~* "\.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2|ttf|eot)$" {
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ---------- SPA routing ----------
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate, private" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Content-Type-Options "nosniff" always;

        # Si más adelante proxías /api, NO uses proxy_cookie_path para flags.
        # Usa proxy_cookie_flags (nativo) en el bloque /api. :contentReference[oaicite:2]{index=2}
        # proxy_cookie_path queda sólo para reescritura de path.
    }

    # ---------- API (placeholder) ----------
    location /api/ {
        # Ejemplo si habilitas backend:
        # proxy_pass http://backend:3001;
        # proxy_set_header Host $host;
        # proxy_set_header X-Real-IP $remote_addr;
        # proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # proxy_set_header X-Forwarded-Proto $scheme;

        # Flags seguros de cookies de backend (si proxías):
        # proxy_cookie_flags ~ secure httponly samesite=strict;  # aplica a todas
        return 404;
    }

    # ---------- Seguridad adicional ----------
    location ~ /\. { deny all; return 404; }
    location ~ ~$  { deny all; return 404; }

    # ---------- Errores ----------
    error_page 500 502 503 504 /50x.html;
    location = /50x.html { internal; }
}